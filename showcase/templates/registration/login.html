<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap | Robotik Kodlama Atölyesi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: radial-gradient(circle at 10% 20%, rgba(243, 246, 255, 1) 0%, rgba(228, 235, 255, 1) 90%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background: white;
            max-width: 420px;
            width: 100%;
        }
        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
        }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center">
    <div class="card login-card p-4 p-md-5">
        <div class="text-center mb-4">
            <div class="badge bg-primary text-white rounded-pill px-3 py-2 mb-2 fw-bold">Atölye Girişi</div>
            <h2 class="fw-bold text-dark mb-1">Öğrenci Girişi</h2>
            <p class="text-muted small">Lütfen öğretmeninizin size verdiği kullanıcı adı ve şifre ile giriş yapın.</p>
        </div>

        {% if form.errors %}
            <div class="alert alert-danger small rounded-3" role="alert">
                Kullanıcı adı veya şifre hatalı! Lütfen tekrar deneyin.
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            
            <div class="mb-3">
                <label for="id_username" class="form-label fw-semibold text-dark small">Kullanıcı Adı</label>
                <input type="text" name="username" autofocus autofocus class="form-control rounded-3 py-2" id="id_username" required>
            </div>
            
            <div class="mb-4">
                <label for="id_password" class="form-label fw-semibold text-dark small">Şifre</label>
                <input type="password" name="password" class="form-control rounded-3 py-2" id="id_password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2.5 rounded-pill fw-bold shadow-sm">Giriş Yap</button>
            
            <div class="text-center mt-3">
                <a href="/" class="text-muted small text-decoration-none">← Ana Sayfaya Dön</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
